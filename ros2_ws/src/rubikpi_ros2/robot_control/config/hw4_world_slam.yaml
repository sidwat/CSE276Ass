# HW4 EXTRA CREDIT (SLAM): the world for `ros2 launch robot_control hw4_slam_launch.py`.
#
# Same arena, start and goal as hw4_world.yaml, but the robot does NOT know where the obstacle
# is. EKF-SLAM maps the tags (walls and box) while it drives; the box is estimated from the
# mapped box tags and the path is replanned on that estimate (robot_control/slam_obstacle.py).
#
# WHAT THE ROBOT USES:  arena.size, robot.radius, start, goal, planner, slam (incl. slam.prior)
#                       and, only with slam.prior_landmarks: walls, the WALL tags below.
# GROUND TRUTH ONLY:    obstacles and the BOX tags below. They are never used for planning or
#                       localisation; `hw4_slam sim` simulates them and `hw4_slam eval` scores
#                       the SLAM map and the obstacle estimate against them. Measure them.
#
# World frame as in hw4_world.yaml: origin at the south-west corner, x east, y north, metres.

arena:
  size: 3

# GROUND TRUTH (evaluation / simulation only)
obstacles:
  - center: [1.44, 1.60]   # <-- MEASURE
    size: [0.61, 0.61]     # <-- MEASURE

robot:
  radius: 0.13

start: [2.35, 0.65, 2.3562]   # facing the box: its south and east faces are mapped at the start
goal: [0.70, 2.35, 3.1416]

# AprilTags. Use ONE family (36h11) for the box too: a second apriltag_node on the same 1280x720
# image stream received almost no frames on the RubikPi during the known-map runs, so the box
# tags were never detected. Ids 10-17 are free and in apriltag_ros/cfg/tags_36h11.yaml.
landmarks:
  # Wall tags (HW3 measurements). Known to the robot only with slam.prior_landmarks: walls.
  - {id: 0, x: 3.05, y: 0.96, yaw: 3.1416}
  - {id: 7, x: 3.01, y: 2.03, yaw: 3.1416}
  - {id: 1, x: 2.00, y: 3.04, yaw: -1.5708}
  - {id: 3, x: 0.96, y: 3.04, yaw: -1.5708}
  - {id: 4, x: -0.04, y: 2.04, yaw: 0.0}
  - {id: 8, x: 0.04, y: 0.96, yaw: 0.0}
  - {id: 9, x: 0.97, y: -0.04, yaw: 1.5708}
  - {id: 5, x: 1.98, y: -0.04, yaw: 1.5708}
  # Box tags, GROUND TRUTH ONLY (the robot maps them). Two per face, each flush with one END of
  # the face (tag centre 0.2185 m = 0.305 - 0.0865 from the face centre on a 2 ft box), printed
  # side outward, centre at camera height. Tags at the face ends pin the box sides best (see
  # robot_control/slam_obstacle.py); any placement on the face is valid.  <-- MEASURE after mounting
  - {id: 10, x: 1.745, y: 1.3815, yaw: 0.0}     # east face
  - {id: 11, x: 1.745, y: 1.8185, yaw: 0.0}
  - {id: 12, x: 1.6585, y: 1.905, yaw: 1.5708}  # north face
  - {id: 13, x: 1.2215, y: 1.905, yaw: 1.5708}
  - {id: 14, x: 1.135, y: 1.8185, yaw: 3.1416}  # west face
  - {id: 15, x: 1.135, y: 1.3815, yaw: 3.1416}
  - {id: 16, x: 1.2215, y: 1.295, yaw: -1.5708} # south face
  - {id: 17, x: 1.6585, y: 1.295, yaw: -1.5708}

planner:
  timing:
    v: 0.35                # m/s, hw4_slam.yaml max_v
    w: 1.3
    t_stop: 1.5
    t_pass: 0.3
  pass_through: true
  fast:
    margin: 0.08
    corner_segments: 2
    turn_cost: true
    merge_corners: true
    max_merge_extra: 0.10
  safe:
    resolution: 0.02
    min_clearance: 0.25
    simplify_tolerance: 0.03

slam:
  # What the robot knows about the obstacle before mapping it: an axis-aligned box whose centre
  # is within center_tolerance of center and whose sides are at most max_size. Until a box tag
  # is mapped the planner avoids that whole region; each mapped face shrinks it.
  prior:
    center: [1.5, 1.5]       # "in the middle of the arena"
    center_tolerance: 0.25
    max_size: [0.61, 0.61]   # HW4 allows 1x1 to 2x2 ft
  k_sigma: 2.0               # widen each face bound by this many SLAM standard deviations ...
  bound_margin: 0.03         # ... plus this (m): map error the SLAM covariance does not capture
  tag_half_width: 0.0865     # m, half the printed tag size (each tag lies entirely on its face)
  wall_band: 0.30            # m: tags closer than this to a wall are wall tags
  replan_threshold: 0.03     # m change of any side of the estimate that triggers a replan
  replan_interval: 2.0       # s between map-triggered replans (a blocked path replans at once)
  freeze_radius: 0.30        # m from the goal: stop replanning
  min_leg: 0.12              # m: merge legs shorter than this (the controller's replan_distance is
                             # 0.10 m: it cannot drive a shorter leg), keeping their clearance
  # none: full SLAM, every tag (walls and box) is mapped from scratch.
  # walls: the wall tags above are known (a prior map, refined as seen); only the box is mapped.
  prior_landmarks: none
