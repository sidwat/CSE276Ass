# Parameters for velocity_control in HW4 (known tag map, world frame), see launch/hw4_launch.py.
# Calibration and controller settings are copied from hw3.yaml; re-check speed_per_unit at the
# start of each session (it drifts with the battery). The world (arena, box, tags, start, goal)
# lives in hw4_world.yaml; hw4_launch.py plans from it and passes waypoints_file,
# landmarks_file, start_pose, world_file, log_dir and run_name.
#
# Both runs use the SAME speeds and gains, so the comparison isolates the planner.
velocity_control_node:
  ros__parameters:
    speed_per_unit: 1.26
    wheel_base: 0.68
    wheel_trim: -0.06

    use_vision: true
    use_slam: false         # HW4 may use the known map: HW2-style EKF on (x, y, theta)
    camera_frame: camera_frame
    camera_x: 0.1           # m, camera lens ahead of the point the robot turns about: MEASURE THIS
    camera_y: 0.0           # m, camera left of that point
    camera_yaw: 0.0         # rad
    camera_upside_down: false
    max_tag_range: 2.5      # m, a 17.3 cm tag is ~30 px at 2.5 m; farther ranges are unreliable
    relocalize_after: 8     # rejected sightings in a row before trusting the tags over odometry
    use_imu: false
    imu_yaw_sign: 1.0
    log_period: 0.1         # s between trajectory.csv rows (finer than HW3 for the clearance plot)

    # The robot starts at hw4_world.yaml `start` (passed as start_pose) with this uncertainty
    start_std_xy: 0.02      # m, tape-measured placement
    start_std_theta: 0.05   # rad (~3 deg), hand placement of the heading

    # Clearance guard: stop the run if the ESTIMATE puts the robot body within guard_margin of an
    # obstacle for guard_cycles control cycles (a last line of defence, not part of the planner)
    clearance_guard: true
    guard_margin: 0.0       # m: stop when clearance < robot radius + guard_margin
    guard_cycles: 3

    pause_at_waypoint: 0.5  # s after settle_time at each STOP waypoint (pass-through: none)
    start_delay: 5.0        # s standing still at the start (camera + apriltag come up)
    control_rate: 20.0      # Hz
    max_wheel_cmd: 0.5
    min_wheel_cmd: 0.15     # motor dead-band: weaker commands are scaled up to it

    # --- Controller (as HW3) ---
    pos_tolerance: 0.03
    heading_tolerance: 0.1
    replan_distance: 0.1
    settle_time: 1.0
    search_turn_time: 0.3
    search_look_time: 1.0
    search_max_turn: 6.3
    k_v: 1.26
    k_w: 1.26
    max_v: 0.25             # m/s (hw4_world.yaml timing.v)
    min_v: 0.19             # m/s -> wheel 0.15, at the dead-band
    max_w: 1.6
    min_w: 1.1
    # Off-line drift before the robot stops and re-turns: lateral error ~ v * angle / k_w, so 0.5
    # rad allows ~10 cm and 0.3 rad ~6 cm. Keep it well inside fast.margin (0.10 m).
    realign_angle: 0.3
    pass_radius: 0.05       # m, a pass-through vertex (theta nan) counts inside this

    # --- EKF noise (robot_control/localization.py NoiseParams), as HW2/HW3 ---
    odom_dist_std: 0.1
    odom_turn_std: 0.5
    odom_drift_std: 0.05
    range_std: 0.02
    range_std_per_m: 0.03
    bearing_std: 0.02
    orientation_std: 0.15
    gate: 11.34
