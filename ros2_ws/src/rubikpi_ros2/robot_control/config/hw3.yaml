# Parameters for velocity_control in HW3 (EKF-SLAM: landmark positions and count unknown),
# see launch/hw3_launch.py. Motion calibration and controller settings are copied from hw2.yaml;
# re-check speed_per_unit at the start of each session (it drifts with the battery).
velocity_control_node:
  ros__parameters:
    speed_per_unit: 1.26
    wheel_base: 0.68
    wheel_trim: -0.06

    use_vision: true
    use_slam: true          # EKF-SLAM: no landmarks_file; tags enter the state when first seen
    camera_frame: camera_frame
    camera_x: 0.1           # m, camera lens ahead of the point the robot turns about: MEASURE THIS
    camera_y: 0.0           # m, camera left of that point
    camera_yaw: 0.0         # rad
    camera_upside_down: false
    max_tag_range: 2.5      # m, a 17.3 cm tag is ~30 px at 2.5 m; farther ranges are unreliable
    use_imu: false          # true: predict heading from the IMU yaw (recommended if it is good)
    imu_yaw_sign: 1.0
    log_dir: ~/CSE276Ass/ros2_ws/hw3_logs   # hw3_launch.py overrides it with <workspace>/hw3_logs
    log_period: 0.5         # s between trajectory.csv rows

    pause_at_waypoint: 0.5  # s, after settle_time
    start_delay: 5.0        # s standing still at the start: the first tags are mapped while the
                            # pose is still exactly known, so they get the smallest covariance
    control_rate: 20.0      # Hz
    max_wheel_cmd: 0.5
    min_wheel_cmd: 0.15     # motor dead-band (calibrate_motion): weaker commands are scaled up to it

    # --- Controller (as HW2, slower for less motion blur and latency error) ---
    pos_tolerance: 0.03
    heading_tolerance: 0.1
    replan_distance: 0.1
    settle_time: 1.0
    search_turn_time: 0.3
    search_look_time: 1.0
    search_max_turn: 6.3
    search_inflate: 0.3     # rad of heading std added when a SEARCH starts (HW2 used 1.0)
    k_v: 1.26
    k_w: 1.26
    max_v: 0.25             # m/s -> wheel 0.20 (HW2 value; 0.15 -> 0.12 stalled the motors)
    min_v: 0.19             # m/s -> wheel 0.15, at the dead-band
    max_w: 1.6
    min_w: 1.1
    realign_angle: 0.5

    # --- EKF noise (robot_control/localization.py NoiseParams); calibrate per plan 2.7 ---
    odom_dist_std: 0.1      # m of error after driving 1 m
    odom_turn_std: 0.5      # rad of error after turning 1 rad (commanded turns are unreliable)
    odom_drift_std: 0.05    # rad of heading drift after driving 1 m
    range_std: 0.02         # m
    range_std_per_m: 0.03
    bearing_std: 0.02       # rad
    orientation_std: 0.15   # rad
    gate: 11.34             # Mahalanobis^2 cutoff, 99% for 3 DOF (9.21 is used for 2 DOF)

    # --- SLAM (robot_control/slam.py SLAMParams) ---
    landmark_dof: 3         # 3: (x, y, psi) per landmark; 2: (x, y). Report both.
    min_sightings: 3        # a new tag must be seen this often ...
    candidate_window: 1.5   # s ... within this window ...
    candidate_spread: 0.15  # m ... at positions agreeing this closely, before it is mapped
    max_incidence: 1.05     # rad (60 deg): reject grazing views, where PnP orientation flips
    latency_std: 0.15       # s, tau: angle noise (w * tau)^2 for camera latency while turning
    initial_std: 0.0001     # Sigma_0|0 = initial_std^2 I: the start pose defines the map frame

    # --- Visualization / laps ---
    waypoints_per_lap: 0    # set by hw3_launch.py from path:=square|octagon (4 / 8)
    publish_markers: true   # /slam/landmarks (MarkerArray), /slam/pose, /slam/path for foxglove
    map_frame: slam_map
